name: Deploy browser game

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate Python entry points
        run: >-
          python -m py_compile
          airplane_shooter_advanced.py
          airplane_shooter_advanced_patched.py
          main.py
          streamlit_app.py

      - name: Install Pygbag
        run: python -m pip install pygbag==0.9.2

      - name: Prepare browser package
        run: |
          find . -type f -name "*.wav" -delete
          rm -f streamlit_app.py

      - name: Build browser game
        run: >-
          python -m pygbag --build
          --title "Air Combat: River Run"
          .

      - name: Version browser package
        shell: bash
        run: |
          package="$(find build/web -maxdepth 1 -name '*.apk' -print -quit)"
          versioned="river-airoplane-${GITHUB_SHA}.apk"
          mv "$package" "build/web/$versioned"
          sed -i "s|$(basename "$package")|$versioned|g" build/web/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload browser build
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
